<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forwood Procedure QA</title><link rel="stylesheet" href="style.css"><script defer src="jszip.min.js"></script><script defer src="app.js"></script>
<header><span class="logo">F</span><div><strong>Forwood</strong><small>PROCEDURE QA</small></div><button id="export" disabled>Export Excel ↓</button></header>
<main><h1>Checklist review</h1><p class="muted">Keep questions short and put the evidence in the guidance.</p>
<section class="setup" aria-label="Workbook setup"><label>Source workbook<input id="file" type="file" accept=".xlsx"></label><label>Worksheet<select id="sheet"></select></label><label>Question column<input id="column" value="C" maxlength="3"></label><label>ID column<input id="idColumn" value="A" maxlength="3"></label><label>Header row<input id="headerRow" type="number" value="4" min="1"></label><button id="run">Run checks</button></section>
<details><summary>Configure guidelines</summary><p class="muted">Edit the starter rules below. Set a question length cue, phrases to flag, and optional wording replacements. Checks are advisory.</p><textarea id="rules" aria-label="Guidelines JSON" rows="12" spellcheck="false"></textarea></details>
<p id="message" role="status">Open an Excel workbook or <button id="demo" class="secondary">try sample data</button>.</p>
<section id="review" hidden><div class="toolbar"><strong id="count"></strong><label>Reviewer<input id="reviewer" placeholder="Your name"></label><label>Search<input id="search" placeholder="ID or question"></label><label>Filter<select id="filter"><option>All</option><option>Needs attention</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Edited</option></select></label></div>
<div class="workspace"><nav id="queue" aria-label="Procedure queue"></nav><article id="detail"></article></div></section></main></html>
